    <!-- Prestige Typography Suite (Self-Hosted) -->

      @font-face {
        font-family: 'Inter';

    <style>
      :root {
        --color-bg-primary: #080a0f;
        --color-card-bg: rgba(20, 25, 35, 0.6);
        --color-text-primary: #f8fafc;
        --color-text-secondary: #64748b;
        --color-accent: #FFBC2D;
        --color-text-on-accent: #0f172a;
        --color-border: rgba(255, 255, 255, 0.05);
        --bg-gradient: radial-gradient(circle at 50% -20%, #1e293b 0%, #080a0f 70%, #000 100%);
        --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* --- PRESTIGE THEME ENGINE (SYMMETRIC INVERSION) --- */
      
      /* Pair 1: Midnight & Sunny */
      body.theme-default-dark { --color-bg-primary: #080a0f; --color-card-bg: rgba(20, 25, 35, 0.6); --color-accent: #FFBC2D; --color-text-primary: #f8fafc; --color-text-secondary: #64748b; }

      body.theme-moleskine { --color-bg-primary: #f5f5f5; --color-card-bg: #ffffff; --color-text-primary: #1a1a1a; --color-text-secondary: #71717a; --color-accent: #000000; --color-text-on-accent: #fff; --color-border: rgba(0,0,0,0.1); --bg-gradient: none; }

      /* Pair 3: Deep Space & Polar */
      body.theme-deep-space { --color-bg-primary: #020617; --color-card-bg: rgba(30, 41, 59, 0.5); --color-accent: #38bdf8; --color-text-primary: #f8fafc; --color-text-secondary: #94a3b8; }
      body.theme-polar { --color-bg-primary: #f0f9ff; --color-card-bg: rgba(255, 255, 255, 0.7); --color-text-primary: #0f172a; --color-text-secondary: #64748b; --color-accent: #0ea5e9; --color-border: rgba(0,0,0,0.05); --bg-gradient: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #f0f9ff 100%); }

      /* Pair 4: Cyber & Sakura */
      body.theme-cyber { --color-bg-primary: #0f0b18; --color-card-bg: rgba(88, 28, 135, 0.4); --color-accent: #f472b6; --color-text-primary: #f8fafc; --color-text-secondary: #fb7185; --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #000 100%); }
      body.theme-sakura { --color-bg-primary: #fff1f2; --color-card-bg: rgba(255, 255, 255, 0.85); --color-text-primary: #881337; --color-text-secondary: #fb7185; --color-accent: #f43f5e; --bg-gradient: linear-gradient(to bottom, #ffe4e6, #fff1f2); }

      body.theme-coffee { --color-bg-primary: #fdfbf7; --color-card-bg: rgba(255, 255, 255, 0.8); --color-text-primary: #44403c; --color-text-secondary: #a8a29e; --color-accent: #92400e; --bg-gradient: linear-gradient(to bottom, #f5f5f4, #fdfbf7); }

      /* Pair 6: Slate & Cloudy */
      body.theme-slate { --color-bg-primary: #0f172a; --color-card-bg: rgba(51, 65, 85, 0.5); --color-accent: #94a3b8; --color-text-primary: #f8fafc; --color-text-secondary: #94a3b8; }
      body.theme-cloudy { --color-bg-primary: #f8fafc; --color-card-bg: #ffffff; --color-text-primary: #334155; --color-text-secondary: #94a3b8; --color-accent: #64748b; --color-border: rgba(0,0,0,0.05); }

      /* Pair 7: Terminal & Mint */
      body.theme-terminal { --color-bg-primary: #000000; --color-card-bg: rgba(20, 20, 20, 0.8); --color-accent: #22c55e; --color-text-primary: #22c55e; --color-text-secondary: #166534; }
      body.theme-mint { --color-bg-primary: #f0fdf4; --color-card-bg: rgba(255, 255, 255, 0.8); --color-text-primary: #064e3b; --color-text-secondary: #34d399; --color-accent: #10b981; --bg-gradient: none; }

      /* Pair 8: Sunset & Peach */
      body.theme-sunset { --color-bg-primary: #451a03; --color-card-bg: rgba(120, 53, 15, 0.3); --color-accent: #f97316; --color-text-primary: #f8fafc; --color-text-secondary: #fb923c; }
      body.theme-peach { --color-bg-primary: #fff7ed; --color-card-bg: rgba(255, 255, 255, 0.8); --color-text-primary: #7c2d12; --color-text-secondary: #fb923c; --color-accent: #fb923c; }

      body {
        margin: 0;
        background-color: var(--color-bg-primary);
        background-image: var(--bg-gradient);
        background-attachment: scroll; 
        color: var(--color-text-primary);
        font-family: var(--font-primary);
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
      }

      @media (min-width: 1024px) {
          body { background-attachment: fixed; }
      }

      .font-brand { font-family: 'Playfair Display', serif; }

      .bg-card { 
          background-color: var(--color-card-bg) !important; 
          backdrop-filter: blur(8px) saturate(190%); 
          -webkit-backdrop-filter: blur(8px) saturate(190%);
          border: 1px solid var(--color-border);
          box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
          transition: background-color 0.6s ease, border-color 0.6s ease;
      }
      
      @media (prefers-reduced-motion: reduce), (hover: none) {
          .bg-card { backdrop-filter: none; background-color: var(--color-bg-primary) !important; }
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--color-accent); border-radius: 10px; opacity: 0.3; }

      @keyframes rollIn {
        0% { transform: rotate(-180deg) translateX(-100px); opacity: 0; }
        100% { transform: rotate(0deg) translateX(0); opacity: 1; }
